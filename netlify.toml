# Live Arts ERP — frontend + API deployed together.
#
#   web/dist        → static site
#   backend/dist    → wrapped as a single Lambda at /.netlify/functions/api
#   /api/*          → rewritten to that function (same origin, so no CORS)
#
# Set the environment variables listed in docs/DEPLOY-NETLIFY.md in the Netlify UI
# (Site configuration → Environment variables) before the first deploy.

[build]
  # `npm install` at the root installs both workspaces and hoists their dependencies
  # into ./node_modules, where the function bundler can find them.
  command = "npm run build"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # The web build bakes this in; same-origin keeps CORS out of the picture.
  VITE_API_URL = "/api/v1"

[functions]
  node_bundler = "esbuild"
  # Ship the compiled Nest output with the function bundle.
  included_files = ["backend/dist/**"]
  # Nest resolves these lazily/dynamically, and bcrypt is a native binding — esbuild
  # must copy them from node_modules instead of trying to inline them.
  external_node_modules = [
    "@nestjs/common",
    "@nestjs/core",
    "@nestjs/config",
    "@nestjs/jwt",
    "@nestjs/mongoose",
    "@nestjs/passport",
    "@nestjs/platform-express",
    "@nestjs/swagger",
    "@nestjs/throttler",
    "@nestjs/websockets",
    "@nestjs/microservices",
    "@nestjs/bullmq",
    "bcrypt",
    "bullmq",
    "ioredis",
    "mongoose",
    "class-transformer",
    "class-validator",
    "passport",
    "passport-jwt",
    "helmet",
    "joi",
    "express",
    "reflect-metadata",
    "rxjs"
  ]

# ---- routing -------------------------------------------------------------
# API first: these must win before the SPA catch-all.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Swagger lives outside the /api/v1 prefix.
[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/api/api/docs"
  status = 200
  force = true

# SPA fallback — client-side routes (/students, /settings, …) must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---- scheduled jobs (replaces BullMQ, which needs a long-lived process) ----
[functions."daily-jobs"]
  schedule = "0 20 * * *"      # 01:30 IST

[functions."monthly-jobs"]
  schedule = "30 0 1 * *"      # 06:00 IST on the 1st

# ---- headers -------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
